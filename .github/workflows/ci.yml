name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No personal data or keys in the repository
        run: node scripts/check-clean.mjs
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: test · build · install (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.13.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zhiro/daemon test
      - run: pnpm build
      - name: The built package installs and runs (stranger's machine)
        run: node scripts/smoke.mjs
      - name: Nothing personal in the package
        run: node scripts/check-clean.mjs out/npm

  install-script:
    name: install script, no Node needed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack ./out/npm --pack-destination "${{ runner.temp }}"
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:ZHIRO_HOME = "$env:RUNNER_TEMP\zhiro"
          $env:ZHIRO_PACKAGE = (Get-ChildItem "$env:RUNNER_TEMP\zhiro-*.tgz").FullName
          $env:ZHIRO_NO_PATH = "1"
          ./scripts/install.ps1
          & "$env:RUNNER_TEMP\zhiro\bin\zhiro.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export ZHIRO_HOME="$RUNNER_TEMP/zhiro" ZHIRO_NO_PATH=1
          export ZHIRO_PACKAGE="$(ls "$RUNNER_TEMP"/zhiro-*.tgz)"
          sh scripts/install.sh
          "$RUNNER_TEMP/zhiro/bin/zhiro" --version
